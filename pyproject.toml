[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iqoptionapi"
version = "9.4"
description = "Python wrapper for the IQ Option trading API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Lu-Yi-Hsun", email = "yihsun1992@gmail.com" },
]
keywords = ["iqoption", "trading", "api", "websocket", "binary-options", "digital-options", "forex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests",
    "websocket-client==0.58",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=7",
    "pytest-cov",
    "mypy>=1.5",
    "types-requests",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
]

[project.urls]
Homepage = "https://github.com/Lu-Yi-Hsun/iqoptionapi_pro"
Documentation = "https://lu-yi-hsun.github.io/iqoptionapi_pro/"
Repository = "https://github.com/Lu-Yi-Hsun/iqoptionapi_pro"
Issues = "https://github.com/Lu-Yi-Hsun/iqoptionapi_pro/issues"

[tool.setuptools.packages.find]
include = ["iqoptionapi*"]

[tool.setuptools.package-data]
iqoptionapi = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["site", "docs", "old_document.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (legacy code uses single letters)
    "B008",  # function call in argument defaults
    "B904",  # raise ... from err (legacy try/except patterns)
    "SIM105", # contextlib.suppress (would change legacy behavior)
]

[tool.ruff.lint.per-file-ignores]
"iqoptionapi/constants.py" = ["E501"]
"iqoptionapi/__init__.py" = ["F401"]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.8"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
